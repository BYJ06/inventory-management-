<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../images/IMG1.png" type="image/x-icon">
    <title>Inventory management System</title>
</head>
<body>
    <header>
        <h1>
            Inventory Management System
        </h1>
        <p>Manage your products and stock efficiently</p>
    </header>
    <main>
        <section id="dashboard">
            <h2>
                Inventory Dashboard</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <h3>Total products</h3>
                        <p id="total-products">0</p>
                    </div>
                     <div class="stat-card">
                        <h3>Total stock</h3>
                        <p id="total-stock">0</p>
                    </div>
                     <div class="stat-card">
                        <h3>Inventory value</h3>
                        <p id="inventory-value">0 FCFA</p>
                    </div>
                </div>
                <section id="product-registration">
                    <h2>Register a product</h2>
                    <form id="product-form">
                        <div class="form-group">
                            <label for="product-name">Product name</label>
                            <input type="text"
                            id="product-name"
                            placeholder="Enter product name"
                            required>
                        </div>
                        <div class="form-group">
                            <label for="product-price">Price (FCFA)</label>
                            <input type="number"
                            id="product-price"
                            placeholder="Enter price"
                            min="1"
                            required>
                        </div>
                         <div class="form-group">
                            <label for="product-quantity">Quantity </label>
                            <input type="number"
                            id="product-quantity"
                            placeholder="Enter quantity"
                            min="0"
                            required>
                        </div>
                        <button type="submit">Add product</button>
                    </form>
                    <p id="form-message"></p>
                </section>
                <section id="product-list">
                    <h2>Product Inventory</h2>
                    <input type="text"
                    id="search-input"
                    placeholder="Search by product name">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Price (FCFA)</th>
                                <th>Quantity</th>
                                <th>Total value</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body"></tbody>
                    </table>
                </section>
            
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
